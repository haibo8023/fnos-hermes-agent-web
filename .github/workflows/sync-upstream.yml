name: Sync Upstream & Build & Release

on:
  # 仅手动触发（workflow_dispatch / 或由同步脚本 --push 触发）。
  # 已取消定时自动同步上游：自动构建发布未经真机核验会带病上线
  # （0.20.5.02 缺 web_dist 全量用户网关失败、官方 _cancel_ws_orphan_reap 未定义等），
  # 上游更新改为人工确认后手动触发。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 配置 git（publish/build 需要）
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config remote.origin.url "https://x-access-token:${GITHUB_TOKEN}@github.com/veenyi/fnos-hermes-agent-web.git"
          git tag --sort=-creatordate | head -3 || true

      # 检测上游版本 + 更新 VERSION（无新提交时脚本直接退出，后续步骤跳过）
      - name: Detect upstream & bump version
        id: version
        run: |
          node scripts/sync-upstream.js
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # 拉取上游（官方 monorepo，运行时核心在仓库根）
      - name: Clone upstream
        run: |
          if [ ! -d "upstream/.git" ]; then
            git clone --depth 1 https://github.com/NousResearch/hermes-agent.git upstream
          else
            (cd upstream && git fetch --depth 1 origin main && git reset --hard origin/main)
          fi
          echo "upstream version: $(grep -m1 '^version' upstream/pyproject.toml)"

      - name: Check version changed
        id: check
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          echo "prev_tag=$PREV_TAG"
          echo "new_version=${{ steps.version.outputs.version }}"
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" = "v${{ steps.version.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本未变化，跳过发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 受控合并（移植原则）：只同步官方运行时核心到 app/hermes-src，
      # 桌面端( apps/native/web/website/docs/evals )与 tests 排除，
      # 移植修改(PORT_OVERRIDES: server.py/methods_config.py/web_server.py)保留
      - name: Merge upstream (受控合并)
        if: steps.check.outputs.changed == 'true'
        run: |
          node scripts/merge-upstream.js --upstream upstream --write

      # 先提交合并结果（build.sh 增量包 diff 需要 HEAD 包含合并）
      - name: Commit sync & merge
        if: steps.check.outputs.changed == 'true'
        run: |
          git add VERSION .upstream-state app/hermes-src scripts/merge-upstream.js
          git commit -m "sync: 上游 ${{ steps.version.outputs.version }} 受控合并（保留移植修改）" --allow-empty || true

      # venv-bundle（约 70MB，不提交仓库）：优先用本仓库 Release 的 venv-bundle 资产，
      # 没有则从本仓库/veenyi 的 .fpk 里解包提取（跨仓库只读仅为兜底）。
      - name: Fetch venv-bundle
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p fpk
          if [ -f fpk/venv-bundle.tar.gz ]; then
            echo "✓ venv-bundle 已存在于工作区，跳过获取"
          else
            AUTH=(-H "Authorization: token ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json')
            list_assets() {  # $1=repo → 逐行打印资产下载地址
              curl -sS "${AUTH[@]}" "https://api.github.com/repos/$1/releases?per_page=30" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{for(const r of JSON.parse(d)){for(const a of (r.assets||[])){console.log(a.browser_download_url)}}}catch(e){}})"
            }
            pick() {  # $1=repo $2=正则
              list_assets "$1" | grep -E "$2" | head -1 || true
            }
            VENV_URL="$(pick "$GITHUB_REPOSITORY" 'venv-bundle[^/]*\.tar\.gz$')"
            if [ -n "$VENV_URL" ]; then
              echo "◈ 取本仓库 venv-bundle 资产: $VENV_URL"
              curl -sSL -o fpk/venv-bundle.tar.gz "$VENV_URL"
            else
              FPK_URL="$(pick "$GITHUB_REPOSITORY" '\.fpk$')"
              if [ -z "$FPK_URL" ]; then
                echo "⚠ 本仓库无可用 Release，回退取 veenyi/fnos-hermes-agent-web 的 .fpk"
                FPK_URL="$(pick veenyi/fnos-hermes-agent-web '\.fpk$')"
              fi
              [ -n "$FPK_URL" ] || { echo "✗ 找不到 venv-bundle 来源（既无 venv-bundle 资产也无 .fpk）" >&2; exit 1; }
              echo "下载完整包并提取: $FPK_URL"
              curl -sSL -o /tmp/prev.fpk "$FPK_URL"
              (cd /tmp && rm -rf prevpkg && mkdir -p prevpkg \
                && tar xzf prev.fpk -C prevpkg app.tgz \
                && VENV_MEMBER="$(tar tzf prevpkg/app.tgz | grep -E '(^|/)venv-bundle[^/]*\.tar\.gz$' | head -1)" \
                && [ -n "$VENV_MEMBER" ] && echo "venv-bundle 成员: $VENV_MEMBER" \
                && tar xzf prevpkg/app.tgz -C prevpkg "$VENV_MEMBER" \
                && mv "prevpkg/$VENV_MEMBER" "$GITHUB_WORKSPACE/fpk/venv-bundle.tar.gz")
            fi
          fi
          ls -la fpk/venv-bundle.tar.gz && echo "✓ venv-bundle 就绪"

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: |
          bash scripts/build.sh

      # 包内校验：拦住「载荷缺包 / 版本号文件没更新」类事故（只有真机才暴露）
      - name: Verify package contents
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          FPK="$GITHUB_WORKSPACE/dist/fnos-hermes-agent_v$(cat "$GITHUB_WORKSPACE/VERSION").fpk"
          [ -f "$FPK" ] || { echo "✗ 未找到 $FPK" >&2; exit 1; }
          rm -rf /tmp/verify-pkg && mkdir -p /tmp/verify-pkg && cd /tmp/verify-pkg
          tar xzf "$FPK" app.tgz
          tar xzf app.tgz ./config/bootstrap/hermes-version.env ./hermes-src/hermes_platform/__init__.py
          WANT="$(cut -d. -f1-3 "$GITHUB_WORKSPACE/VERSION")"
          grep -qx "HERMES_VERSION=$WANT" ./config/bootstrap/hermes-version.env \
            || { echo "✗ hermes-version.env 版本不符（期望 $WANT）:" >&2; cat ./config/bootstrap/hermes-version.env >&2; exit 1; }
          tar tzf app.tgz | grep -qE '(^|/)venv-bundle.*\.tar\.gz$' \
            || { echo "✗ 包内缺 venv-bundle.tar.gz" >&2; exit 1; }
          echo "✓ 包内校验通过：hermes_platform + venv-bundle 均在包内，目标版本 = $WANT"

      - name: Publish
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish.sh

      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin HEAD:main
